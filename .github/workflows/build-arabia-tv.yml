name: Build Arabia TV APK

on:
  push:
    branches: [codex/arabia-tv-android]
    paths:
      - 'arabia-tv/**'
      - '.github/workflows/build-arabia-tv.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Verify and unpack Arabia TV
        run: |
          echo '250acb599c02e16fc92aefa185ee3842853089bc55c3f7f7b4eea14332fdda27  arabia-tv/ArabiaTV-Android-sorgenti.zip' | sha256sum -c -
          unzip -t arabia-tv/ArabiaTV-Android-sorgenti.zip
          unzip -q arabia-tv/ArabiaTV-Android-sorgenti.zip -d buildsrc

      - name: Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Install Android SDK 35
        run: |
          SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then SDKMANAGER="$(command -v sdkmanager)"; fi
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" 'platform-tools' 'platforms;android-35' 'build-tools;35.0.0'

      - name: Check public live streams and catalog
        working-directory: buildsrc/ArabiaTV
        run: |
          python3 -m unittest discover -s tools -p "test_*.py" -v
          python3 tools/verify_streams.py
          python3 tools/validate_catalog.py

      - name: Unit tests, Android Lint and APK
        working-directory: buildsrc/ArabiaTV
        run: gradle --no-daemon :app:testDebugUnitTest :app:lintDebug :app:assembleDebug :app:assembleDebugAndroidTest --stacktrace

      - name: Verify and collect APK
        run: |
          mkdir -p out
          cp buildsrc/ArabiaTV/app/build/outputs/apk/debug/app-debug.apk out/ArabiaTV-1.0.0.apk
          cp buildsrc/ArabiaTV/stream-report.json out/stream-report.json
          cp buildsrc/ArabiaTV/app/src/main/assets/channels.json out/channels-in-apk.json
          unzip -t out/ArabiaTV-1.0.0.apk
          "$ANDROID_SDK_ROOT/build-tools/35.0.0/apksigner" verify --verbose out/ArabiaTV-1.0.0.apk
          sha256sum out/ArabiaTV-1.0.0.apk > out/SHA256SUMS.txt

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: ArabiaTV-1.0.0-apk
          path: out/
          if-no-files-found: error
          retention-days: 14

      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Android emulator UI smoke tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          script: |
            gradle -p buildsrc/ArabiaTV --no-daemon :app:connectedDebugAndroidTest --stacktrace
            adb install -r out/ArabiaTV-1.0.0.apk
            adb shell am force-stop it.mourad.arabiatv
            adb shell am start -W -n it.mourad.arabiatv/.MainActivity
            adb shell dumpsys activity activities | grep -E "mResumedActivity.*it.mourad.arabiatv"
            sleep 3
            adb shell screencap -p /sdcard/arabia-tv.png
            adb pull /sdcard/arabia-tv.png out/ArabiaTV-screen.png

      - name: Upload test results and screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ArabiaTV-verification
          path: |
            out/ArabiaTV-screen.png
            buildsrc/ArabiaTV/app/build/reports/
            buildsrc/ArabiaTV/app/build/outputs/androidTest-results/
            buildsrc/ArabiaTV/stream-report.json
          if-no-files-found: warn
