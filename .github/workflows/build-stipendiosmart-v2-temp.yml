name: Build StipendioSmart V2 APK (temporary)

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/build-stipendiosmart-v2-temp.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout StipendioSmart build branch
        uses: actions/checkout@v4
        with:
          ref: stipendiosmart-apk

      - name: Rebuild and align Android project
        run: |
          cat stipendiosmart/chunk_00.b64 stipendiosmart/chunk_01_0.b64 stipendiosmart/chunk_01_1.b64 stipendiosmart/chunk_01_2.b64 stipendiosmart/chunk_01_3.b64 stipendiosmart/chunk_02.b64 stipendiosmart/chunk_03.b64 stipendiosmart/chunk_04.b64 stipendiosmart/chunk_05.b64 > stipendiosmart-source-full.b64
          base64 --decode stipendiosmart-source-full.b64 > StipendioSmart-source.zip
          echo 'd6aa5061828d3701443e97f98b64f49eb0251ca1b80e3923f5fb8a1065157d39  StipendioSmart-source.zip' | sha256sum -c -
          unzip -t StipendioSmart-source.zip
          unzip -q StipendioSmart-source.zip -d buildsrc
          sed -i 's/compileSdk = 37/compileSdk = 35/' buildsrc/StipendioSmart/app/build.gradle.kts
          sed -i 's/targetSdk = 37/targetSdk = 35/' buildsrc/StipendioSmart/app/build.gradle.kts
          sed -i 's/version "9.4.1"/version "8.9.1"/' buildsrc/StipendioSmart/build.gradle.kts
          sed -i 's/version "9.0.1"/version "8.9.1"/' buildsrc/StipendioSmart/build.gradle.kts
          sed -i 's/compose-bom:2026.09.00/compose-bom:2025.04.01/' buildsrc/StipendioSmart/app/build.gradle.kts
          sed -i 's/activity-compose:1.13.0/activity-compose:1.10.1/' buildsrc/StipendioSmart/app/build.gradle.kts
          sed -i 's/core-ktx:1.18.0/core-ktx:1.16.0/' buildsrc/StipendioSmart/app/build.gradle.kts
          python3 - <<'PY'
          from pathlib import Path
          p = Path('buildsrc/StipendioSmart/app/build.gradle.kts')
          s = p.read_text()
          s = s.replace('''    kotlinOptions {\n        jvmTarget = "17"\n    }\n\n''', '')
          if 'compilerOptions {' not in s:
              s += '''\n\nkotlin {\n    compilerOptions {\n        jvmTarget.set(org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17)\n    }\n}\n'''
          p.write_text(s)
          PY

      - name: Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK 35
        run: |
          SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then SDKMANAGER="$(command -v sdkmanager)"; fi
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Test and build APK
        working-directory: buildsrc/StipendioSmart
        run: |
          gradle --no-daemon :app:testDebugUnitTest --stacktrace
          gradle --no-daemon :app:assembleDebug --stacktrace

      - name: Rename APK
        run: cp buildsrc/StipendioSmart/app/build/outputs/apk/debug/app-debug.apk StipendioSmart-V2-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: StipendioSmart-V2-debug-apk
          path: StipendioSmart-V2-debug.apk
          if-no-files-found: error
