name: Build Radio Maroc APK

on:
  push:
    branches: [ "radio-maroc-apk" ]
    paths:
      - "RadioMarocApp/**"
      - ".github/workflows/radio-maroc-build.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        working-directory: RadioMarocApp
        run: gradle :app:assembleDebug --stacktrace

      - name: Rename APK
        run: cp RadioMarocApp/app/build/outputs/apk/debug/app-debug.apk RadioMaroc-v1.0-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: RadioMaroc-APK
          path: RadioMaroc-v1.0-debug.apk
          if-no-files-found: error
