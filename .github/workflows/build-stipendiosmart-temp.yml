name: Build StipendioSmart APK (temporary)

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/build-stipendiosmart-temp.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout StipendioSmart build branch
        uses: actions/checkout@v4
        with:
          ref: stipendiosmart-apk

      - name: Rebuild source archive
        run: |
          cat stipendiosmart/chunk_00.b64 stipendiosmart/chunk_01.b64 stipendiosmart/chunk_02.b64 stipendiosmart/chunk_03.b64 stipendiosmart/chunk_04.b64 stipendiosmart/chunk_05.b64 > stipendiosmart-source-full.b64
          base64 --decode stipendiosmart-source-full.b64 > StipendioSmart-source.zip
          unzip -t StipendioSmart-source.zip
          unzip -q StipendioSmart-source.zip -d buildsrc
          sed -i 's/compileSdk = 37/compileSdk = 35/' buildsrc/StipendioSmart/app/build.gradle.kts
          sed -i 's/targetSdk = 37/targetSdk = 35/' buildsrc/StipendioSmart/app/build.gradle.kts

      - name: Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK 35
        run: |
          SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then SDKMANAGER="$(command -v sdkmanager)"; fi
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Gradle 9.6
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      - name: Test and build APK
        working-directory: buildsrc/StipendioSmart
        run: |
          gradle --no-daemon :app:testDebugUnitTest --stacktrace
          gradle --no-daemon :app:assembleDebug --stacktrace

      - name: Rename APK
        run: cp buildsrc/StipendioSmart/app/build/outputs/apk/debug/app-debug.apk StipendioSmart-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: StipendioSmart-debug-apk
          path: StipendioSmart-debug.apk
          if-no-files-found: error
