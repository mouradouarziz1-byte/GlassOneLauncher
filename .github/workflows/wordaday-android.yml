name: Build WordADay V2 APK

on:
  push:
    branches: ["wordaday-v2"]
    paths:
      - "WordADay/**"
      - ".github/workflows/wordaday-android.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: "15859902"
          packages: "platform-tools"

      - name: Install Android SDK packages
        run: |
          android --sdk="$ANDROID_SDK_ROOT" sdk install platforms/android-37
          android --sdk="$ANDROID_SDK_ROOT" sdk install build-tools/36.0.0

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      - name: Unit tests
        working-directory: WordADay
        run: gradle :app:testDebugUnitTest --stacktrace

      - name: Android lint
        working-directory: WordADay
        run: gradle :app:lintDebug --stacktrace

      - name: Build debug APK
        working-directory: WordADay
        run: gradle :app:assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: WordADay-V2-APK
          path: WordADay/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
